kind = "web"
previewPath = "/"
title = "Neuralis AI"
version = "1.0.0"
id = "artifacts/neuralis-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21490

[services.development]
run = "pnpm --filter @workspace/neuralis-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/neuralis-ai", "run", "build" ]
publicDir = "artifacts/neuralis-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21490"
BASE_PATH = "/"
